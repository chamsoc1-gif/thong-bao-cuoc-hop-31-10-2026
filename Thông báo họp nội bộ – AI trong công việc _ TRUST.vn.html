<style>
  /* ===== Màu thương hiệu – chỉnh tại đây ===== */
  :root{--orange:#f96f1e;--green:#bcd02f;--ink:#141414;--sub:#4b4b4b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:20px 12px;background:#e9edf2;font-family:"Be Vietnam Pro",Arial,sans-serif}
  .stage{width:100%;max-width:1180px;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(20,40,70,.22);background:#fefefd}
  svg{display:block;width:100%;height:auto}
  text{font-family:"Be Vietnam Pro",Arial,sans-serif}
  .tb{transform-box:fill-box}

  /* ===== Hiệu ứng (kiểu công nghệ / AI) ===== */
  /* 1. Đường chạy quanh khung ngày giờ */
  .run{stroke-dashoffset:0;animation:run 4.5s linear 3.5s infinite}
  @keyframes run{to{stroke-dashoffset:-100}}
  /* 2. Gạch chân dòng phụ chảy liên tục */
  .march{animation:march 1.4s linear infinite}
  @keyframes march{to{stroke-dashoffset:-28}}
  /* 3. Vẽ nét biểu tượng lịch */
  .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s ease-out 3.4s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .cell{opacity:0;animation:cell .4s ease-out forwards;animation-delay:var(--d)}
  @keyframes cell{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
  /* 4. Ghim rơi xuống rồi nảy */
  .drop{animation:drop .9s cubic-bezier(.3,1.6,.5,1) 4s both}
  @keyframes drop{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:none}}
  .sh{animation:shd 2.4s ease-in-out 5s infinite;transform-origin:center}
  @keyframes shd{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(1.7);opacity:.1}}
  /* 5. Nhãn thông báo trượt vào */
  .sr{animation:sr .9s cubic-bezier(.2,.9,.3,1.15) 1.1s both}
  @keyframes sr{from{opacity:0;transform:translateX(140px)}to{opacity:1;transform:none}}
  .arc{opacity:0;animation:arc 1.8s ease-in-out infinite}
  .arc:nth-child(2){animation-delay:.25s}.arc:nth-child(3){animation-delay:.5s}
  @keyframes arc{0%{opacity:0}30%{opacity:1}70%,100%{opacity:0}}
  /* 5b. Dòng "Kính mời" trượt xuống + nhấp nháy nhẹ chữ "Kính mời:" */
  .inv{animation:inv .9s cubic-bezier(.2,.9,.3,1.1) 2.3s both}
  @keyframes inv{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
  .pls{animation:pls 2.2s ease-in-out 3.4s infinite}
  @keyframes pls{0%,100%{opacity:1}50%{opacity:.5}}
  /* 6. Nhân vật phóng chậm (Ken Burns) */
  .man{transform-origin:62% 55%;animation:kb 14s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.035)}}
  /* 7. Vòng đứt nét quay quanh chip AI */
  .spin{transform-origin:center;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 8. Chữ số nhị phân bay lên */
  .bit{opacity:0;font-weight:700;font-size:22px;fill:#bcd02f;animation:bit var(--t,8s) ease-in infinite;animation-delay:var(--d,0s)}
  @keyframes bit{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110px);opacity:0}}
  /* 9. Con trỏ nhấp nháy khi gõ giờ */
  /* 5c. Linh vật robot + khẩu hiệu đáy poster */
  .rise{animation:rise .9s cubic-bezier(.2,.9,.3,1.15) 3.2s both}
  @keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  .flt{animation:flt 3.4s ease-in-out 4.2s infinite}
  .flt2{animation:flt 2.8s ease-in-out 4.6s infinite reverse}
  @keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .pop1{animation:pop .8s cubic-bezier(.2,.9,.3,1.2) 3.6s both}
  .pop2{animation:pop .8s cubic-bezier(.2,.9,.3,1.2) 3.9s both}
  @keyframes pop{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
  .tw{animation:tw 1.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .steam{animation:steam 2.6s ease-in infinite;opacity:0}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.cell{opacity:1}.draw{stroke-dashoffset:0}.bit{display:none}}
</style>

<script>
(function(){
  var svg=document.getElementById('poster'),stage=document.getElementById('stage');
  var calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(calm){
    /* Giảm chuyển động: bỏ hiệu ứng SMIL, hiện đủ nội dung ngay */
    svg.querySelectorAll('animate,animateMotion,animateTransform').forEach(function(a){a.remove()});
    document.getElementById('revealRect').setAttribute('width',1536);
    document.getElementById('cDateRect').setAttribute('width',580);
    document.getElementById('cTimeRect').setAttribute('width',700);
    return;
  }
  /* Đèn rọi mờ đi theo con trỏ chuột (máy tính) */
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  var spot=document.getElementById('spot');
  stage.addEventListener('mousemove',function(e){
    var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    var q=p.matrixTransform(svg.getScreenCTM().inverse());
    spot.setAttribute('cx',q.x);spot.setAttribute('cy',q.y);
  });
  stage.addEventListener('mouseleave',function(){spot.setAttribute('cx',-400);spot.setAttribute('cy',-400)});
})();
</script>
